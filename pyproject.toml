[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scribeforge"
version = "0.1.0"
description = "Transcripción local con faster-whisper y resúmenes LLM para audio/vídeo de cualquier duración"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.0", "ruff>=0.4"]

[project.scripts]
scribeforge = "scribeforge.cli:main"

[tool.setuptools.packages.find]
include = ["scribeforge*"]

[tool.setuptools.package-data]
scribeforge = ["prompts/*.md"]
