# Copia a config.yaml y ajusta. Sin este fichero, ScribeForge usa estos mismos defaults.
model:
  size: small          # tiny|base|small|medium|large-v3
  device: auto         # auto|cpu|cuda
  language: auto       # o "es"

summary:
  mode: meeting        # interview|meeting|lecture
  context_chars: 24000
  timeout_s: 120

llm:
  endpoints:
    - name: local-ollama
      base_url: http://localhost:11434/v1
      model: qwen3:4b
    - name: groq                       # fallback si no hay Ollama
      base_url: https://api.groq.com/openai/v1
      model: llama-3.3-70b-versatile
      api_key_env: SCRIBEFORGE_API_KEY
